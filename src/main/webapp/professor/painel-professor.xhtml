<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<h:head>
    <title>SLA - Painel do Professor</title>
</h:head>

<h:body>

    <h2>Sistema de Localização Acadêmica</h2>

    <h3>Painel do Professor</h3>

    <h:form>

        <h4>Bem-vindo, #{professorBean.professorLogado.nome}!</h4>

        <h3>Minhas Aulas</h3>

        <h:dataTable value="#{professorBean.alocacoes}"
                     var="aula"
                     border="1">

            <h:column>
                <f:facet name="header">Disciplina</f:facet>
                #{aula.disciplina.nome}
            </h:column>

            <h:column>
                <f:facet name="header">Horário</f:facet>
                #{aula.horario}
            </h:column>

            <h:column>
                <f:facet name="header">Sala</f:facet>
                #{aula.sala.numero}
            </h:column>

        </h:dataTable>

        <br />

        <h:commandButton value="Sair"
                         action="#{loginBean.deslogar}" />

    </h:form>

</h:body>
</html>
