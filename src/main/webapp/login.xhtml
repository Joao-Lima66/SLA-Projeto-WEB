<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>SLA - Login Acadêmico</title>
</h:head>
<h:body>
    <h:form>
        <h3>Sistema de Localização Acadêmica - Login</h3>
        <h:messages globalOnly="true" style="color:red;" />
        
        <h:panelGrid columns="2">
            <h:outputLabel for="email" value="E-mail:" />
            <h:inputText id="email" value="#{loginBean.email}" required="true" />
            
            <h:outputLabel for="senha" value="Senha:" />
            <h:inputSecret id="senha" value="#{loginBean.senha}" required="true" />
            
            <h:commandButton value="Entrar" action="#{loginBean.entrar}" />
        </h:panelGrid>
    </h:form>
</h:body>
</html>
