<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>SLA - Sistema de Localização Acadêmica</title>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            width: 380px;
            border-radius: 12px !important;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3) !important;
            background-color: #ffffff !important;
            padding: 10px;
        }
        .login-header {
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 20px;
        }
        .login-header h2 {
            margin: 5px 0 0 0;
            color: #1e3a8a;
            font-size: 22px;
            font-weight: 700;
        }
        .login-header p {
            margin: 4px 0 0 0;
            color: #64748b;
            font-size: 13px;
        }
        .field-group {
            margin-bottom: 18px;
        }
        .field-group label {
            font-weight: 600;
            color: #334155;
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }
        .btn-entrar {
            width: 100%;
            background-color: #2563eb !important;
            border-color: #2563eb !important;
            font-weight: 700 !important;
            font-size: 15px !important;
            padding: 8px !important;
            border-radius: 6px !important;
        }
        .btn-entrar:hover {
            background-color: #1d4ed8 !important;
        }
    </style>
</h:head>
<h:body>
    <p:card styleClass="login-card">
        <div class="login-header">
            <h2>🎓 Portal SLA</h2>
            <p>Sistema de Localização Acadêmica</p>
        </div>
        
        <h:form>
            <p:messages globalOnly="true" closable="true" style="margin-bottom: 15px;"/>

            <div class="field-group">
                <p:outputLabel for="email" value="📧 E-mail Acadêmico:" />
                <p:inputText id="email" value="#{loginBean.email}" required="true" 
                             placeholder="seu.email@uniceplac.edu.br" style="width: 100%; font-size: 14px;"/>
            </div>

            <div class="field-group">
                <p:outputLabel for="senha" value="🔒 Senha:" />
                <p:password id="senha" value="#{loginBean.senha}" required="true" 
                            placeholder="••••••••" style="width: 100%; font-size: 14px;"/>
            </div>

            <p:commandButton value="Acessar Sistema ➔" action="#{loginBean.entrar}" 
                             update="@form" styleClass="btn-entrar" />
        </h:form>
    </p:card>
</h:body>
</html>
